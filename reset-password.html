<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ec6a1a">
  <title>비밀번호 재설정 · 헬스와 필라테스</title>
  <link rel="stylesheet" href="style.css?v=62">
  <link rel="icon" href="images/icon-192.png">
</head>
<body>
  <main class="login-screen password-reset-screen">
    <div class="login-box">
      <p class="label">헬스와 필라테스</p>
      <h1 id="resetTitle" tabindex="-1">비밀번호 재설정</h1>
      <p id="resetDescription" class="login-description">화면을 준비하고 있어요.</p>

      <section id="resetRequestSection" hidden>
        <form id="resetRequestForm" class="login-form">
          <label for="resetEmail">가입한 이메일</label>
          <input id="resetEmail" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" required>
          <button id="sendResetEmailButton" class="auth-primary-button" type="submit" disabled>재설정 메일 보내기</button>
          <p id="resetRequestMessage" class="auth-status" role="status" aria-live="polite" aria-atomic="true"></p>
        </form>
        <p class="auth-help">메일이 오지 않으면 이메일 주소와 스팸메일함을 확인해 주세요. 가입한 이메일을 사용할 수 없다면 센터 데스크에 문의해 주세요.</p>
      </section>

      <section id="resetPasswordSection" hidden>
        <p id="resetAccountEmail" class="auth-account"></p>
        <form id="resetPasswordForm" class="login-form">
          <label for="newPassword">새 비밀번호</label>
          <div class="password-field">
            <input id="newPassword" type="password" autocomplete="new-password" minlength="8" aria-describedby="newPasswordHelp" required>
            <button class="password-toggle" type="button" data-reset-password-toggle="newPassword" aria-label="새 비밀번호 보기" aria-pressed="false">👁</button>
          </div>
          <p id="newPasswordHelp" class="auth-help">8자 이상으로 입력해 주세요. 영문·숫자·특수문자를 섞으면 더 안전해요.</p>
          <label for="newPasswordConfirm">새 비밀번호 확인</label>
          <div class="password-field">
            <input id="newPasswordConfirm" type="password" autocomplete="new-password" minlength="8" required>
            <button class="password-toggle" type="button" data-reset-password-toggle="newPasswordConfirm" aria-label="새 비밀번호 확인 보기" aria-pressed="false">👁</button>
          </div>
          <button id="saveNewPasswordButton" class="auth-primary-button" type="submit">새 비밀번호 저장</button>
          <p id="resetPasswordMessage" class="auth-status" role="status" aria-live="polite" aria-atomic="true"></p>
        </form>
      </section>

      <section id="resetSuccessSection" hidden>
        <p class="auth-success-mark" aria-hidden="true">✓</p>
        <p class="auth-status" role="status">새 비밀번호가 저장됐어요.<br>앱에서 새 비밀번호로 로그인해 주세요.</p>
      </section>

      <p id="resetPageMessage" class="auth-status" role="status" aria-live="polite"></p>
      <a id="resetBackLink" class="signup-link-button auth-text-link" href="./">로그인으로 돌아가기</a>
      <img class="screen-logo screen-logo-bottom" src="images/center-logo.png" alt="헬스와 필라테스 화곡점">
      <noscript><p class="auth-status">비밀번호 재설정을 이용하려면 브라우저에서 자바스크립트를 허용해 주세요.</p></noscript>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="password-reset.js?v=62"></script>
</body>
</html>
